<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compra Simple</title>
    <style>
      body {
        max-width: 700px;
        margin: 40px auto;
        padding: 0 16px;
        font-family: Arial, sans-serif;
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 12px;
        max-width: 360px;
      }

      label {
        display: grid;
        gap: 4px;
      }

      input,
      button {
        padding: 8px;
        font: inherit;
      }

      #consejo {
        padding: 12px;
        background: #e8f3ff;
      }

      #mensaje {
        min-height: 24px;
      }
    </style>
    <script src="main.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Simulador de carrito</h1>
      <p>Agrega productos y calcula el total de tu compra.</p>

      <p id="consejo" aria-live="polite" hidden></p>

      <form id="formulario-producto">
        <label>
          Nombre del producto
          <input id="nombre" type="text" required />
        </label>

        <label>
          Cantidad
          <input id="cantidad" type="number" min="1" step="1" required />
        </label>

        <label>
          Precio por unidad
          <input id="precio" type="number" min="0.01" step="0.01" required />
        </label>

        <button type="submit">Agregar al carrito</button>
      </form>

      <p id="mensaje" role="status" aria-live="polite"></p>

      <h2>Tu carrito</h2>
      <ul id="lista-productos"></ul>
      <button id="boton-finalizar" type="button">Finalizar compra</button>

      <h2>Resumen</h2>
      <p id="resumen">Todavía no finalizaste la compra.</p>
    </main>
  </body>
</html>
